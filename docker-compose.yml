version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: candypro-db
    environment:
      POSTGRES_USER: candypro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-candypro_dev_password}
      POSTGRES_DB: candypro
    # R4-19: Remove host port exposure in production — only expose internally
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candypro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: candypro-api
    environment:
      - PORT=8080
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=candypro
      - DB_PASSWORD=${DB_PASSWORD:-candypro_dev_password}
      - DB_NAME=candypro
      - DB_SSLMODE=disable
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-true}
      # R4-03/R4-04: Required secrets — must be set in .env or environment
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-info@candypro.com}
      - SEED_SUPERADMIN_EMAIL=${SEED_SUPERADMIN_EMAIL:-admin@candypro.com}
      - SEED_SUPERADMIN_PASSWORD=${SEED_SUPERADMIN_PASSWORD:?SEED_SUPERADMIN_PASSWORD is required}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend (Nuxt.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: candypro-frontend
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://api:8080/api/v1}
      - NUXT_PUBLIC_SITE_URL=${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
